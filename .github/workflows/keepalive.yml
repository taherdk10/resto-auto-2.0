name: Cloud Keep-Alive Ping

on:
  repository_dispatch:
    types: [ping-session]
  workflow_dispatch:

# Automatically cancels old queued/hanging ping jobs
concurrency:
  group: keep-alive-ping
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2  # Hard kill if a VM hangs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Keep-Alive
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 cloud_keep_alive.py
