name: Reserve All Meals

on:
  schedule:
    # Runs daily at 06:00, 12:00, and 19:00 UTC (7:00 AM, 1:00 PM, and 8:00 PM Tunis Time)
    - cron: '0 6,12,19 * * *'
  repository_dispatch:
    types: [reserve-meals]
  workflow_dispatch:

jobs:
  reserve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Execute Reservation Engine
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT1_TOKEN: ${{ secrets.TELEGRAM_BOT1_TOKEN }}
          TELEGRAM_BOT2_TOKEN: ${{ secrets.TELEGRAM_BOT2_TOKEN }}
        run: python reserve_all.py
